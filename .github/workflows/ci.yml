name: ci
on: push
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit tests need no torch and no data; tests that need them skip themselves in CI.
      - run: pip install $(grep -E '^(numpy|scipy|scikit-learn|pillow|faiss-cpu|pytest)==' requirements.txt)
      - run: python -m pytest -q
