# DogFaceNet: pipeline development and cross-dataset evaluation only. Nothing is tuned on it.
[dataset]
name = "dogfacenet"
images = "data/dogfacenet/after_4_bis"
seed = 0

[protocol]
seed = 0
unknown_frac = 0.5
bootstrap = 1000

[train]
steps = 5  # smoke test only; full fine-tunes are reserved for PetFace
precision = "fp32"
run_c_arm = "arcface_bh"  # placeholder so the run (c) smoke test runs; not a choice between arms

[serve]
model = "dinov2_vits14"
top_k = 5
checkpoint = ""  # empty: frozen backbone. One line to switch to a PetFace fine-tune: "data/cache/petface/ckpt/arcface_bh.pt" (non-commercial, DATA.md)
confident_gallery_far = 0.1  # product choice: confidence label at 10% gallery-level FAR on val_a (decisions.md)

[rerank_head]
steps = 20  # smoke test only; full training waits for PetFace train
