[dataset]
name = "petface"
images = "data/PetFace/images"
split_dir = "data/PetFace/split/dog"
verification_csv = "data/PetFace/split/dog/verification.csv"
seed = 0

[protocol]
seed = 0
unknown_frac = 0.5
bootstrap = 1000

[train]
steps = 18000  # fixed before the first run (decisions.md)
precision = "bf16"  # all three PetFace fine-tunes; embeddings stay fp32 (decisions.md)
run_c_arm = ""  # arm with higher closed-set val_a rank-1 after runs (a) and (b); arm (a) on a tie (decisions.md)

[serve]
model = "dinov2_vits14"
top_k = 5
no_match_far = 0.01  # no-match threshold from val_a impostors at the gallery size (decisions.md)

[rerank_head]
steps = 5000  # fixed 2026-10-09; one run, final checkpoint reported (decisions.md)
